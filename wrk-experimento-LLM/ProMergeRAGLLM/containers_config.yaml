# containers_config.yaml
containers:
  - name: promerge-neo4j
    image: neo4j:latest
    ports:
      "7474/tcp": 7474
      "7687/tcp": 7687
    environment:
      NEO4J_AUTH: $"neo4j/{promerge_password}"
    detach: true

  - name: vectordb
    image: qdrant/qdrant:latest
    ports:
      "6333/tcp": 6333
    detach: true